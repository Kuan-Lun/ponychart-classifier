[mypy]
python_version = 3.14
mypy_path = src
warn_unused_configs = True
disallow_untyped_defs = True
check_untyped_defs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
warn_return_any = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
disallow_untyped_decorators = True
no_implicit_reexport = True

# External packages: treat as Any regardless of whether stubs are present.
# `ignore_missing_imports` covers the "package not installed" case;
# `follow_imports = skip` covers the "package installed but stubs are
# incomplete or wrong" case (e.g. torch). Having both means dev machines
# with different install profiles all get the same behaviour.
[mypy-numpy.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-cv2.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-onnxruntime.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-torch.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-torchvision.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-sklearn.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-PIL.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-onnx.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-psutil.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-scipy.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-matplotlib.*]
ignore_missing_imports = True
follow_imports = skip
[mypy-pytest.*]
ignore_missing_imports = True
follow_imports = skip

# Subpackages that interact heavily with numerical libraries (torch, numpy,
# cv2, onnxruntime). Because those libraries are treated as Any (see above),
# several strict options fire on every interaction even though the code is
# correct. Relax them only here, keeping strict mode everywhere else.
[mypy-cli.*]
disallow_subclassing_any = False
disallow_untyped_decorators = False
warn_return_any = False
warn_unused_ignores = False

[mypy-ponychart_classifier.training.*]
disallow_subclassing_any = False
disallow_untyped_decorators = False
warn_return_any = False
warn_unused_ignores = False

[mypy-ponychart_classifier.inference]
warn_return_any = False

[mypy-ponychart_classifier.stats.*]
warn_return_any = False

[mypy-tests.*]
disallow_untyped_decorators = False
