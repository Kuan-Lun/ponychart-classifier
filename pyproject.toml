[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ponychart-classifier"
version = "0.4.3"
description = "Multi-label image classifier for PonyChart character identification."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = { text = "GNU Affero General Public License v3" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "certifi>=2026.2.25; sys_platform == 'darwin'",
    "numpy>=2.4.4",
    "opencv-python>=4.13.0.92",
    "onnxruntime>=1.24.4",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
train = [
    "flask>=3.1.3",
    "onnx>=1.21.0",
    "onnxscript>=0.6.2",
    "Pillow>=12.2.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.8.0",
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
dev = [
    "black>=26.3.1",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "pymarkdownlnt>=0.9.36",
    "pytest>=9.0.3",
]
[project.urls]
Homepage = "https://github.com/Kuan-Lun/ponychart-classifier"
Tracker = "https://github.com/Kuan-Lun/ponychart-classifier/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/ponychart_classifier"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Mirror flake8's Black-compatible ignore set (see .vscode/settings.json).
# These pycodestyle rules conflict with Black's formatting choices.
extend-ignore = ["E203", "E226", "E501"]
