[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ponychart-classifier"
version = "0.7.0"
description = "Multi-label image classifier for PonyChart character identification."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = { text = "GNU Affero General Public License v3" }
requires-python = ">=3.13,<3.15"
dependencies = [
    "certifi>=2026.6.17; sys_platform == 'darwin'",
    "numpy>=2.5.0",
    "opencv-python>=4.13.0.92",
    "onnxruntime>=1.27.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
train = [
    "flask>=3.1.3",
    "onnx>=1.22.0",
    "onnxscript>=0.7.0",
    "Pillow>=12.2.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.0",
    "torch>=2.12.1",
    "torchvision>=0.27.1",
]
dev = [
    "black>=26.5.1",
    "ruff>=0.15.20",
    "mypy>=2.1.0",
    "pymarkdownlnt>=0.9.38",
    "pytest>=9.1.1",
]
[project.urls]
Homepage = "https://github.com/Kuan-Lun/ponychart-classifier"
Tracker = "https://github.com/Kuan-Lun/ponychart-classifier/issues"

[tool.hatch.build.targets.wheel]
exclude = ["artifacts/**"]
packages = ["src/ponychart_classifier"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Mirror flake8's Black-compatible ignore set (see .vscode/settings.json).
# These pycodestyle rules conflict with Black's formatting choices.
extend-ignore = ["E203", "E226", "E501"]
