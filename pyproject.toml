[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "ponychart-classifier"
version = "0.10.0"
description = "Multi-label image classifier for PonyChart character identification."
readme = "README.md"
authors = [{ name = "Kuan-Lun Wang" }]
license = { text = "GNU Affero General Public License v3" }
requires-python = ">=3.14,<3.15,!=3.14.1"
dependencies = [
    "certifi>=2026.7.22; sys_platform == 'darwin'",
    "numpy>=2.5.2",
    "opencv-python>=5.0.0.93",
    "onnxruntime>=1.28.0",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3.14",
]

[project.optional-dependencies]
train = [
    "flask>=3.1.3",
    "onnx>=1.22.0",
    "onnxscript>=0.7.1",
    "Pillow>=12.3.0",
    "psutil>=7.2.2",
    "scikit-learn>=1.9.0",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
]
dev = [
    "black>=26.5.1",
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pymarkdownlnt>=0.9.39",
    "pytest>=9.1.1",
]
[project.urls]
Homepage = "https://github.com/Kuan-Lun/ponychart-classifier"
Tracker = "https://github.com/Kuan-Lun/ponychart-classifier/issues"

[tool.hatch.build.targets.wheel]
exclude = ["artifacts/**"]
packages = ["src/ponychart_classifier"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
# Mirror flake8's Black-compatible ignore set (see .vscode/settings.json).
# These pycodestyle rules conflict with Black's formatting choices.
extend-ignore = ["E203", "E226", "E501"]
