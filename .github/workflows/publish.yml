name: Publish to PyPI

on:
  push:
    branches: [main]
    paths: [pyproject.toml]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install release tooling
        run: python -m pip install "build==1.5.0" "packaging==26.3"

      - name: Check version bump
        id: version
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if ! git cat-file -e "${BEFORE_SHA}:pyproject.toml"; then
            echo "Unable to read pyproject.toml from pre-push commit ${BEFORE_SHA}" >&2
            exit 1
          fi

          CURRENT=$(python -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          PREVIOUS=$(git show "${BEFORE_SHA}:pyproject.toml" | python -c "
          import tomllib, sys
          print(tomllib.load(sys.stdin.buffer)['project']['version'])
          ")
          BUMPED=$(python - "$CURRENT" "$PREVIOUS" <<'PY'
          import sys

          from packaging.version import Version

          current, previous = map(Version, sys.argv[1:])
          if current < previous:
              raise SystemExit(f"Version must increase: {previous} -> {current}")
          print("true" if current > previous else "false")
          PY
          )
          {
            echo "current=$CURRENT"
            echo "previous=$PREVIOUS"
            echo "bumped=$BUMPED"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        if: steps.version.outputs.bumped == 'true'
        run: python -m build

      - name: Publish
        if: steps.version.outputs.bumped == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
